name: reproduce

# The repository claims it runs offline with no dependencies and reproduces
# exactly. This is that claim, checked on a machine that is not the author's.
on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 3.9 is the oldest version the code claims to support, and uv brings it
      - run: uv run --python 3.9 reproduce.py --with-notebooks
